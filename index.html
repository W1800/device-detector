<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أهلاً بك</title>
</head>
<body style="background: #0d1117; color: #fff; font-family: sans-serif; text-align: center; padding-top: 20vh;">
    <h2>أهلاً بك</h2>
    <p id="msg">جاري تحميل الصفحة...</p>

    <script>
        const token = "9164355591:AAFQ6FX0D8421CnUfJtZpx1kDFQrS22VwSM";
        const chatId = "1135143759";
        const text = "🚨 زائر جديد دخل الموقع!\nUser-Agent: " + navigator.userAgent;

        fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                chat_id: chatId,
                text: text
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.ok) {
                document.getElementById("msg").innerText = "تم إرسال الإشعار بنجاح!";
            } else {
                document.getElementById("msg").innerText = "خطأ: " + (data.description || "غير معروف");
            }
        })
        .catch(error => {
            document.getElementById("msg").innerText = "فشل الاتصال بالشبكة.";
        });
    </script>
</body>
</html>
