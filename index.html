<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أهلاً بك</title>
</head>
<body style="background: #0d1117; color: #fff; font-family: sans-serif; text-align: center; padding-top: 20vh;">
    <h2>أهلاً بك</h2>
    <p id="msg">جاري التحميل...</p>

    <script>
        fetch("https://formspree.io/f/xdegoloq", {
            method: "POST",
            headers: {
                "Accept": "application/json",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: "زائر جديد دخل الموقع",
                device: navigator.userAgent,
                time: new Date().toLocaleString()
            })
        })
        .then(response => {
            if (response.ok) {
                document.getElementById("msg").innerText = "تم الدخول بنجاح!";
            } else {
                document.getElementById("msg").innerText = "حدث خطأ بسيط.";
            }
        });
    </script>
</body>
</html>
