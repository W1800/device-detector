<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أهلاً بك</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #30363d;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>أهلاً بك</h2>
        <p id="status">جاري فحص الجهاز...</p>
    </div>

    <script>
        const BOT_TOKEN = "9236614438:AAH_AH0P9U114CqeTNPwJa-f8bmR3CBgwK0";
        const CHAT_ID = "1135143759";

        async function detectAndSend() {
            let deviceModel = "غير محدد / iOS";
            let platform = "غير معروف";

            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                try {
                    const ua = await navigator.userAgentData.getHighEntropyValues(["model", "platform"]);
                    if (ua.model) deviceModel = ua.model;
                    if (ua.platform) platform = ua.platform;
                } catch (e) {}
            }

            const rawUserAgent = navigator.userAgent;
            
            if (/iPhone|iPad|iPod/i.test(rawUserAgent)) {
                platform = "iOS (iPhone)";
            } else if (/Android/i.test(rawUserAgent) && platform === "غير معروف") {
                platform = "Android";
            }

            const message = `📱 زائر جديد دخل الموقع!\n\n• النظام: ${platform}\n• الموديل: ${deviceModel}\n• المتصفح: ${rawUserAgent}`;

            try {
                let response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message
                    })
                });
                
                if (response.ok) {
                    document.getElementById("status").innerText = "تم إرسال بيانات جهازك بنجاح!";
                } else {
                    document.getElementById("status").innerText = "فشل الإرسال، تحقق من التوكن أو البوت.";
                }
            } catch (err) {
                document.getElementById("status").innerText = "حدث خطأ في الاتصال.";
                console.error(err);
            }
        }

        detectAndSend();
    </script>
</body>
</html>
