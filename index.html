<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أهلاً بك</title>
</head>
<body style="background: #0d1117; color: #fff; font-family: sans-serif; text-align: center; padding-top: 20vh;">
    <h2>أهلاً بك</h2>
    <p id="msg">جاري تحميل الصفحة...</p>

    <script>
        const token = "9236614438:AAH_AH0P9U114CqeTNPwJa-f8bmR3CBgwK0";
        const chatId = "1135143759";
        const text = "🚨 زائر جديد دخل الموقع!\nUser-Agent: " + navigator.userAgent;

        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=` + encodeURIComponent(text))
        .then(res => res.json())
        .then(data => {
            if(data.ok) {
                document.getElementById("msg").innerText = "تم التحميل بنجاح";
            } else {
                document.getElementById("msg").innerText = "خطأ في الإرسال";
            }
        })
        .catch(err => {
            document.getElementById("msg").innerText = "تعذر الاتصال";
        });
    </script>
</body>
</html>
